name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest matplotlib seaborn

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests/ -v --tb=short

      - name: Verify Experiment Notebook Reproducibility
        env:
          PYTHONPATH: .
          MPLBACKEND: Agg
        run: |
          python -c "import json, os; nb = json.load(open('experiments/seafood_compliance_experiments.ipynb', encoding='utf-8')); ns = {'__name__': '__main__', '__file__': os.path.abspath('experiments/seafood_compliance_experiments.ipynb')}; [exec(''.join(c['source']), ns) for c in nb['cells'] if c['cell_type'] == 'code']; print('Experiment Notebook Clean Run Verified!')"

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
